interface:
  display_name: "Pethost"
  short_description: "Deploy to your own hosting"
  icon_small: "./assets/mark.svg"
  icon_large: "./assets/icon.png"
  brand_color: "#B79CF5"
  default_prompt: "Use $pethost to deploy this project and tell me its address."

dependencies:
